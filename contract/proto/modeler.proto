syntax = "proto3";

// contract-version: 1.0.0
//
// Canonical gRPC contract for the Portunix Modeler (ptx-modeler) symbol conversions and symbol
// source discovery.
//
// This file is the single source of truth. Consumers vendor an identical copy rather than
// hand-writing the wire format:
//   - portunix-plugins  plugins/modeler/contract/modeler.proto   (server, Go; versioned snapshot with
//                       manifest.json, synced by `make contract-sync`, checked by `make contract-check`)
//
// The `contract-version` line above is the semver of the modeler contract (this file plus the
// modeler-*.schema.json and help-ai.schema.json schemas). Additive changes bump the minor version,
// breaking changes the major version. The plugin reports it via `ptx-modeler contract version`,
// ModelerContractService and Health (portunix-plugins #144).
//
// The `package` line is part of the wire identity (`portunix.modeler.ModelerSymbolService`)
// and must not be renamed. Symbol documents travel as JSON bytes that validate against
// contract/schemas/modeler-symbol.schema.json.
package portunix.modeler;

option go_package = "portunix.cz/api/modeler";
option java_package = "cz.portunix.api.modeler";
option java_multiple_files = true;

// Conversion between QElectroTech elements (.elmt) and modeler symbols (*.msym.json),
// portunix-plugins #128. Element RPCs are content based (bytes in, bytes out), so editors can
// convert without shared files; collection and pack RPCs work on paths on the server machine.
// Every response carries the same warnings as the CLI report (`ptx-modeler symbol ... -f json`).
service ModelerSymbolService {
  // .elmt bytes -> *.msym.json bytes
  rpc ImportElement(ImportElementRequest) returns (ImportElementResponse);
  // *.msym.json bytes -> .elmt bytes
  rpc ExportElement(ExportElementRequest) returns (ExportElementResponse);
  // .elmt file or directory on the server -> symbol pack directory
  rpc ImportCollection(ImportCollectionRequest) returns (ConversionResponse);
  // pack directory or *.msym.json file on the server -> .elmt tree or file
  rpc ExportPack(ExportPackRequest) returns (ConversionResponse);

  // KiCad schematic symbols (.kicad_sym, KiCad 6+) -> modeler symbols, portunix-plugins #140.
  // .kicad_sym bytes -> one *.msym.json per symbol and unit
  rpc ImportKicadSymbol(ImportKicadSymbolRequest) returns (ImportKicadSymbolResponse);
  // .kicad_sym file, .kicad_symdir directory or checkout on the server -> symbol pack directory
  rpc ImportKicadLibrary(ImportCollectionRequest) returns (ConversionResponse);

  // Symbol source discovery, portunix-plugins #130. Each response carries the same JSON document
  // as the CLI `ptx-modeler symbol ... -f json` (contract/schemas/modeler-symbol-discovery.schema.json).
  // DraftSourceIssue returns the issue draft and the prefilled URL; no RPC creates issues, that
  // stays with the CLI and the user's own gh credentials.
  rpc SearchSymbols(SearchSymbolsRequest) returns (DiscoveryResponse);
  rpc ListSources(ListSourcesRequest) returns (DiscoveryResponse);
  rpc GetSource(GetSourceRequest) returns (DiscoveryResponse);
  rpc ProbeSource(ProbeSourceRequest) returns (DiscoveryResponse);
  rpc DraftSourceIssue(DraftSourceIssueRequest) returns (DiscoveryResponse);

  rpc Health(HealthRequest) returns (HealthResponse);
}

// Versioned snapshot of this contract embedded in the plugin, portunix-plugins #144, so gRPC clients
// can obtain the .proto and the schemas from a running plugin without a checkout of this repository.
// Responses equal the CLI (`ptx-modeler contract version|list|show -f json`).
service ModelerContractService {
  // Manifest of the snapshot: contract version, source ref/commit and per-file checksums
  rpc GetContractInfo(GetContractInfoRequest) returns (ContractInfo);
  rpc ListContractFiles(ListContractFilesRequest) returns (ListContractFilesResponse);
  // File name (e.g. "modeler.proto") -> content; NOT_FOUND for an unknown name,
  // INVALID_ARGUMENT for an empty name or a path
  rpc GetContractFile(GetContractFileRequest) returns (ContractFile);
}

// Zero values select the defaults of the CLI.
message ConversionOptions {
  string namespace = 1;   // pack namespace, default "qet" (KiCad: "kicad")
  double px_per_mm = 2;   // pixels per paper millimetre; import default 4, export default: stored at import (not used by KiCad)
  string compliance = 3;  // "path" (default) | compliant | derived | vendor | custom (KiCad: custom (default) | vendor)
  string category = 4;    // fixed category instead of the one derived from the path (KiCad: from the library)
  string license = 5;     // SPDX license of imported elements, default CC-BY-3.0 (QElectroTech collection; KiCad: CC-BY-SA-4.0)
  string license_url = 6; // link to the license terms
}

// Pinned origin of an imported element (mirrors `origin` of the symbol schema).
message Origin {
  string type = 1;        // git | file
  string url = 2;
  string revision = 3;    // commit SHA
  string path = 4;
  string format = 5;      // elmt | kicad_sym
  string sha256 = 6;
}

message Warning {
  string code = 1;        // approximated | transform | style | dropped | opaque | default | duplicate
  string message = 2;
}

message ElementReport {
  string source = 1;
  string target = 2;
  string key = 3;
  repeated Warning warnings = 4;
  string error = 5;       // empty when the element converted
}

message ImportElementRequest {
  bytes elmt = 1;
  // Path of the element in its collection, e.g. "10_electric/91_en_60617/x.elmt"; it determines
  // key, category and standard compliance.
  string path = 2;
  ConversionOptions options = 3;
  Origin origin = 4;      // optional base origin (type, url, revision); path, format, sha256 are filled
}

message ImportElementResponse {
  bytes msym_json = 1;
  string key = 2;         // key within the pack (without namespace)
  repeated Warning warnings = 3;
}

message ExportElementRequest {
  bytes msym_json = 1;
  ConversionOptions options = 2;
}

message ExportElementResponse {
  bytes elmt = 1;
  repeated Warning warnings = 2;
}

message ImportCollectionRequest {
  string input_path = 1;  // .elmt file or directory
  string output_path = 2; // pack directory, or *.msym.json for a single file
  ConversionOptions options = 3;
  string root = 4;        // collection root; default the git top level, else the input directory
  string revision = 5;    // origin revision override
  string source_url = 6;  // origin repository URL override
  bool force = 7;         // overwrite existing output
}

// One .kicad_sym file with the other files of its library, so extends resolves across the files
// of a .kicad_symdir. The library name comes from path (Device.kicad_sym or
// Device.kicad_symdir/R.kicad_sym).
message ImportKicadSymbolRequest {
  bytes kicad_sym = 1;
  // Path of the file in its checkout, e.g. "Device.kicad_symdir/R.kicad_sym"; recorded in the origin.
  string path = 2;
  string symbol = 3;      // symbol name; empty = every symbol of the file
  ConversionOptions options = 4;
  Origin origin = 5;      // optional base origin (type, url, revision); path, format, sha256 are filled
  repeated KicadFile library_files = 6; // other .kicad_sym files of the same library directory
}

message KicadFile {
  string path = 1;
  bytes kicad_sym = 2;
}

message ImportKicadSymbolResponse {
  repeated ImportedSymbol symbols = 1; // a multi-unit symbol gives one symbol per unit
}

message ImportedSymbol {
  bytes msym_json = 1;
  string key = 2;         // key within the pack (without namespace)
  string source = 3;      // path#symbol
  repeated Warning warnings = 4;
}

message ExportPackRequest {
  string input_path = 1;  // pack directory or *.msym.json file
  string output_path = 2; // element tree directory or .elmt file
  ConversionOptions options = 3;
  bool force = 4;
}

message ConversionResponse {
  bool ok = 1;            // false when an element failed or the conversion stopped
  string output_path = 2;
  Origin origin = 3;
  int32 converted = 4;
  int32 failed = 5;
  int32 warnings = 6;
  repeated ElementReport elements = 7;
  string error = 8;
}

// Registry layers and symbol packs on the server machine, like --sources and --catalog of the CLI.
message DiscoveryScope {
  repeated string catalogs = 1;  // symbol pack directories
  repeated string sources = 2;   // directories with *.msrc.json files
}

message SearchSymbolsRequest {
  string query = 1;
  string lang = 2;        // language of the titles, default en
  string source = 3;      // only this source id ("catalog" = installed packs)
  string category = 4;
  string standard = 5;
  int32 limit = 6;        // default 20
  DiscoveryScope scope = 7;
}

message ListSourcesRequest {
  DiscoveryScope scope = 1;
}

message GetSourceRequest {
  string id = 1;
  DiscoveryScope scope = 2;
}

message ProbeSourceRequest {
  string url = 1;
  bool network = 2;       // network access is opt-in; known sources need none
  DiscoveryScope scope = 3;
}

message DraftSourceIssueRequest {
  string url = 1;         // source to probe, or
  bytes probe_json = 2;   // a stored probe result (kind "probe")
  string use_case = 3;
  string repo = 4;        // default cassandragargoyle/portunix-plugins
  bool network = 5;
  DiscoveryScope scope = 6;
}

message DiscoveryResponse {
  string kind = 1;        // search | sources | source | probe | issue-draft
  bytes json = 2;         // the CLI -f json document, byte-identical
}

message HealthRequest {}

message HealthResponse {
  string status = 1;      // SERVING
  string version = 2;
  string contract_version = 3; // contract-version of the embedded snapshot
}

message GetContractInfoRequest {}

message ContractSource {
  string repository = 1;  // github.com/cassandragargoyle/api
  string path = 2;        // contract/
  string ref = 3;         // branch or tag the snapshot was synced from
  string commit = 4;      // full commit hash
}

message ContractFileInfo {
  string name = 1;        // file name inside the snapshot, e.g. modeler-ops.schema.json
  string kind = 2;        // json-schema | proto
  int64 size = 3;         // bytes
  string sha256 = 4;      // hex
  string path = 5;        // path in the source repository, e.g. contract/schemas/modeler-ops.schema.json
}

message ContractInfo {
  string contract = 1;    // modeler
  string version = 2;     // contract-version
  ContractSource source = 3;
  string synced_at = 4;   // RFC 3339
  repeated ContractFileInfo files = 5;
  string plugin_version = 6;
  bytes manifest_json = 7; // the embedded manifest.json, byte-identical
}

message ListContractFilesRequest {}

message ListContractFilesResponse {
  string version = 1;     // contract-version
  repeated ContractFileInfo files = 2;
}

message GetContractFileRequest {
  string name = 1;
}

message ContractFile {
  string name = 1;
  string kind = 2;
  bytes content = 3;      // byte-identical to the file in the snapshot
  string sha256 = 4;
}
