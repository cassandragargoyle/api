<svg xmlns='http://www.w3.org/2000/svg' width='640' height='336' viewBox='0 0 640 336'><title>VIM 2026</title><defs><marker id='a' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#5f6b7a'/></marker></defs><rect width='640' height='336' rx='10' fill='#ffffff'/><text x='30' y='36' font-size='16' fill='#1d2a3a' text-anchor='start' font-weight='bold' font-family='Noto Sans, DejaVu Sans, sans-serif'>2026</text><line x1='120' y1='54' x2='120' y2='312' stroke='#1d2a3a' stroke-width='2'/><text x='104' y='69' font-size='13' fill='#5f6b7a' text-anchor='end' font-weight='bold' font-family='Noto Sans, DejaVu Sans, sans-serif'>30 Jan</text><circle cx='120' cy='64' r='6' fill='#1f6fb2'/><text x='138' y='69' font-size='13' fill='#1d2a3a' text-anchor='start' font-weight='normal' font-family='Noto Sans, DejaVu Sans, sans-serif'>vim-parser starts: text blocks, HTML view, QR codes (1.1)</text><text x='104' y='103' font-size='13' fill='#5f6b7a' text-anchor='end' font-weight='bold' font-family='Noto Sans, DejaVu Sans, sans-serif'>31 Jan</text><circle cx='120' cy='98' r='6' fill='#1f6fb2'/><text x='138' y='103' font-size='13' fill='#1d2a3a' text-anchor='start' font-weight='normal' font-family='Noto Sans, DejaVu Sans, sans-serif'>PF4J plugins, tables, metadata (1.2), stemming (1.3)</text><text x='104' y='137' font-size='13' fill='#5f6b7a' text-anchor='end' font-weight='bold' font-family='Noto Sans, DejaVu Sans, sans-serif'>8 Mar</text><circle cx='120' cy='132' r='6' fill='#1f6fb2'/><text x='138' y='137' font-size='13' fill='#1d2a3a' text-anchor='start' font-weight='normal' font-family='Noto Sans, DejaVu Sans, sans-serif'>table of contents layer (1.4), block significance (1.5)</text><text x='104' y='171' font-size='13' fill='#5f6b7a' text-anchor='end' font-weight='bold' font-family='Noto Sans, DejaVu Sans, sans-serif'>24 Mar</text><circle cx='120' cy='166' r='6' fill='#1f6fb2'/><text x='138' y='171' font-size='13' fill='#1d2a3a' text-anchor='start' font-weight='normal' font-family='Noto Sans, DejaVu Sans, sans-serif'>ADR-004: VIM becomes a universal container (2.0)</text><text x='104' y='205' font-size='13' fill='#5f6b7a' text-anchor='end' font-weight='bold' font-family='Noto Sans, DejaVu Sans, sans-serif'>8 May</text><circle cx='120' cy='200' r='6' fill='#1f6fb2'/><text x='138' y='205' font-size='13' fill='#1d2a3a' text-anchor='start' font-weight='normal' font-family='Noto Sans, DejaVu Sans, sans-serif'>ADR-007: the Python port begins</text><text x='104' y='239' font-size='13' fill='#5f6b7a' text-anchor='end' font-weight='bold' font-family='Noto Sans, DejaVu Sans, sans-serif'>19 May</text><circle cx='120' cy='234' r='6' fill='#1f6fb2'/><text x='138' y='239' font-size='13' fill='#1d2a3a' text-anchor='start' font-weight='normal' font-family='Noto Sans, DejaVu Sans, sans-serif'>extraction layer model in Java</text><text x='104' y='273' font-size='13' fill='#5f6b7a' text-anchor='end' font-weight='bold' font-family='Noto Sans, DejaVu Sans, sans-serif'>9 Oct</text><circle cx='120' cy='268' r='6' fill='#1f6fb2'/><text x='138' y='273' font-size='13' fill='#1d2a3a' text-anchor='start' font-weight='normal' font-family='Noto Sans, DejaVu Sans, sans-serif'>ADR-009 ladder, ADR-010 prescriptive layer (2.1)</text><text x='104' y='307' font-size='13' fill='#5f6b7a' text-anchor='end' font-weight='bold' font-family='Noto Sans, DejaVu Sans, sans-serif'>16 Oct</text><circle cx='120' cy='302' r='6' fill='#1f6fb2'/><text x='138' y='307' font-size='13' fill='#1d2a3a' text-anchor='start' font-weight='normal' font-family='Noto Sans, DejaVu Sans, sans-serif'>api binds layers to vim_version</text></svg>
